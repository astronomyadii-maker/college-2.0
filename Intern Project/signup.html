<section id="register">
  <h2>Student Registration</h2>
  <div class="form-box">
    <form onsubmit="return false;">
      <label for="fname">Full Name</label>
      <input type="text" id="fname" placeholder="Enter your full name">

      <label for="enroll">Enrollment No.</label>
      <input type="text" id="enroll" placeholder="Enter your enrollment number">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="dob">Date of Birth:</label>
  <input type="date" id="dob" name="dob" required> <br>

  <label for="Gen">Gender</label>
<input type="radio" id="male" name="gender" value="male" required>
  <label for="male">Male</label><br>
  
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label><br>
  

      <label for="rpass">Password</label>
      <input type="password" id="rpass" placeholder="Create a password">

      <label for="cpass">Confirm Password</label>
      <input type="password" id="cpass" placeholder="Re-enter your password">

      <button type="submit">Register</button>
    </form>
    <div class="toggle-links">
      Already registered? <a href="login.html">Login here</a>
    </div>
  </div>
</section>

</body>
